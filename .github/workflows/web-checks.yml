name: Web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: '1.64.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/web/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Prepare Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/aviator-browser" "playwright@$PLAYWRIGHT_VERSION"
          docker pull "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
      - name: Test the website
        run: |
          python -m uvicorn backend.app.main:app --port 8000 > "$RUNNER_TEMP/aviator-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          docker run --rm --init --ipc=host --network=host \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --volume "$RUNNER_TEMP/aviator-browser/node_modules:/test-deps:ro" --env NODE_PATH=/test-deps \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" node --test tests/browser/*.test.cjs
