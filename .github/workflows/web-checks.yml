name: Web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/web/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Install test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/aviator-browser" playwright@1.64.1
          "$RUNNER_TEMP/aviator-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          echo "NODE_PATH=$RUNNER_TEMP/aviator-browser/node_modules" >> "$GITHUB_ENV"
      - name: Test the website
        run: |
          python -m uvicorn backend.app.main:app --port 8000 > "$RUNNER_TEMP/aviator-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          node --test tests/browser/*.test.cjs
