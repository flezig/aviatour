<script>
(() => {
  const root = document.getElementById('aviator-city-rating');
  const template = root.querySelector('[data-ticket-template]');
  const scale = root.querySelector('.ar-scale-track');
  for (let index = 0; index < 10; index += 1) {
    const segment = document.createElement('span');
    const fill = Math.min(100, Math.max(0, 780 - index * 100));
    segment.style.setProperty('--ar-fraction', `${fill}%`);
    scale.append(segment);
  }

  root.querySelectorAll('[data-variant]').forEach((stage, index) => {
    const badge = stage.querySelector('.ar-badge');
    const ticket = template.content.cloneNode(true);
    const rating = ticket.querySelector('.ar-rating');
    const details = ticket.querySelector('.ar-details');
    const heading = details.querySelector('h2');
    details.id = `ar-details-${index}`;
    heading.id = `ar-heading-${index}`;
    details.setAttribute('aria-labelledby', heading.id);
    badge.setAttribute('aria-controls', details.id);
    ticket.querySelector('.ar-badge-slot').append(badge);
    stage.append(ticket);

    let pinned = false;
    let hovered = false;
    let focused = false;
    let dismissed = false;

    function update() {
      const expanded = pinned || (!dismissed && (hovered || focused));
      badge.setAttribute('aria-expanded', String(expanded));
      details.hidden = !expanded;
    }

    function dismiss() {
      pinned = false;
      dismissed = true;
      update();
    }

    // Closing the variant picker can reveal a badge under a stationary cursor.
    badge.addEventListener('pointermove', event => {
      if (event.pointerType !== 'mouse' || hovered) return;
      hovered = true;
      dismissed = false;
      update();
    });
    rating.addEventListener('pointerleave', event => {
      if (event.pointerType !== 'mouse') return;
      hovered = false;
      update();
    });
    badge.addEventListener('focus', () => {
      focused = badge.matches(':focus-visible');
      if (focused) dismissed = false;
      update();
    });
    badge.addEventListener('blur', () => {
      focused = false;
      update();
    });
    badge.addEventListener('click', () => {
      if (pinned) {
        dismiss();
        return;
      }
      pinned = true;
      update();
    });
    document.addEventListener('click', event => {
      if (!details.hidden && !badge.contains(event.target) && !details.contains(event.target)) dismiss();
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || stage.hidden || details.hidden) return;
      event.preventDefault();
      dismiss();
    });
    update();
  });
})();
</script>
