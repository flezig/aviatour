@media(max-width:760px){html{scroll-padding-top:72px}.bar{height:58px;padding:10px 16px;gap:12px}.brand{font-size:21px}.frame{display:block;padding:14px 10px 30px}.chapters{display:none}.article{border-radius:14px;padding:20px 18px 32px}.article h1{margin:9px 0 25px}.article h2{margin-top:20px}.bars div{grid-template-columns:1.2fr .7fr auto}.contents{min-height:40px}}
</style><header><div class="bar"><a class="brand" href="https://aviatour.vercel.app/"><span class="mark" aria-hidden="true">✈</span>Aviator</a><a class="toplink" href="https://aviatour.vercel.app/">Билеты</a><a class="toplink" href="https://aviatour.vercel.app/city/">Города</a><span class="toplink current">Как мы считаем</span><button class="contents" id="contents" aria-haspopup="dialog">Содержание</button></div></header><main class="frame"><nav class="chapters" aria-label="Темы"><p class="navtitle">Разделы</p><div id="chapters"></div></nav><article class="article" id="article"></article><nav class="outline" id="outline" aria-label="В этом разделе"></nav></main><dialog id="menu" aria-labelledby="menu-title"><div class="dialogbar"><h2 id="menu-title">Содержание</h2><button id="close">Закрыть</button></div><nav class="mobilelist" id="mobile"></nav></dialog><script>
const topics=[["where", "Выбрать направление", [["destinations", "Какие города ищем", "<p>Россия отбирается по стране. Для Турции, Египта, Туниса, Европы, Азии и США проверяем города из списка «Какие города проверяем» в поле «Куда». В списке Европы есть Стамбул и Ларнака. Любой город или аэропорт из справочника можно выбрать отдельно. Таиланд и ОАЭ появляются при вводе названия страны.</p>"], ["home", "Подборки на главной", "<p><b>Ближайшие вылеты.</b> Поездка на 1–7 ночей, вылет через 1–14 дней и цена минимум на 20 % ниже обычной.</p><p><b>По бюджету.</b> Самая дешёвая поездка на 1–7 ночей в каждый город за этот и следующий месяц. «До 10 000 ₽» — города, где она стоит от 5 000 до 10 000 ₽: дешевле — в подборке выше.</p><p><b>К морю, горы и природа, гастрономия.</b> Редакция отобрала города на морском побережье, рядом с природными достопримечательностями и с местной кухней (16.11.2026).</p><p><b>Город на два дня.</b> Поездки на 1–2 ночи, каждый перелёт известен и длится не больше 4 часов, у города есть наши заметки.</p>"], ["kuda", "Куда улететь", "<ul><li>Страницы по бюджету, на выходные и на праздники есть для десяти больших городов вылета. Данные — те же, что в подборках главной, с датой цен.</li><li>«До 10 000 ₽» — все города, где самая дешёвая найденная поездка на 1–7 ночей в этом и следующем месяце не дороже 10 000 ₽ туда и обратно на одного, по одной на город, дешевле — выше.</li><li>«На выходные» и «на праздники» — по тем же правилам, что подборки главной (см. выше).</li><li>Если вариантов сейчас меньше трёх, страница об этом говорит и закрыта от поисковиков.</li></ul>"], ["city-rating", "Как устроен рейтинг города", "<p>Общий балл за месяц складывается из четырёх показателей. Чем заняться — 35%, расходы на месте — 25%, комфорт сезона — 25%, передвижение — 15%. Общий балл появляется, когда подтверждены все четыре показателя. Источники и пробелы в данных можно раскрыть на плашке города.</p>"]]], ["dates", "Подобрать даты", [["nights", "Сколько ночей в поездке", "<p>По умолчанию в выдаче поиска — поездки на 1–14 ночей. Поездки «туда и обратно в один день» и дольше двух недель — в меню длины поездки («Больше 14 ночей», «В тот же день», «Любая длина»). В подборках главной и на страницах городов — поездки до недели (1–7 ночей). При поиске на точные даты длина ничего не прячет.</p>"], ["weekend", "Когда можно без отпуска", "<p><b>Без отпуска.</b> Вылет в пятницу после 18:00 или в субботу, прилёт домой в воскресенье или в понедельник до 09:00 (≈).</p><p><b>На выходные.</b> Вылет в пятницу после 18:00 или в субботу, дома в воскресенье или в понедельник до 09:00 (≈) — без дня отпуска.</p><p><b>Длинные выходные.</b> Нерабочие дни — по Трудовому кодексу (ст. 112) и постановлениям Правительства № 1187 от 17.09.2026 и № 1466 от 24.09.2025. В подборке — поездки на 2–14 ночей, которые захватывают хотя бы два дня отдыха и требуют не больше четырёх дней отпуска. День вылета не считается днём отпуска, если вылет после 18:00; день возвращения — если дома до 09:00.</p>"], ["longer", "Когда дольше — дешевле", "<p>Вылет в тот же день, возвращение на 1–4 дня позже, билеты дешевле минимум на 5 % и 300 ₽, пересадок не больше. Жильё и еда на лишние дни — отдельно.</p>"]]], ["prices", "Сравнить цены", [["fare", "Что входит в цену", "<ul><li>Цены из кеша Aviasales получаем через Travelpayouts Data API и указываем время получения. Наличие мест и цену при покупке проверяйте на Aviasales.</li><li>Цена — билеты туда и обратно на одного взрослого, в рублях. Класс тарифа источник не подтверждает; поиск на Aviasales открывается для эконома.</li><li>Жильё, еда, дорога из аэропорта и багаж в цену не входят. Условия багажа и возврата показывает продавец на Aviasales.</li></ul>"], ["usual", "Откуда берётся обычная цена", "<p>Мы отдельно ищем маршрут на весь месяц и для каждой пары дат берём самую низкую найденную цену. Обычная цена — середина (медиана) этих цен для поездок той же длины: 1–2, 3–4, 5–7 или 8–14 ночей. Считаем её, только если найдено не меньше 8 пар дат; иначе уровень цены не показываем.</p>"], ["level", "Когда пишем «ниже обычной»", "<p>Отличие от обычной цены меньше 15 % — «обычная цена», ниже на 15 % и больше — «ниже обычной», выше — «выше обычной». Нажмите на плашку, чтобы увидеть обычную цену и число пар дат.</p><figure><figcaption>Пример расчёта</figcaption><div class=\"bars\"><div><span>Обычная цена</span><i style=\"--bar:100%;--color:#9caac5\"></i><b>20 000 ₽</b></div><div><span>Найденный билет</span><i style=\"--bar:85%;--color:#2648ef\"></i><b>17 000 ₽</b></div></div><p>На 3 000 ₽ дешевле. Это ровно 15%, поэтому на таком билете появится «Ниже обычной».</p></figure>"], ["nearby", "Дешевле в соседние дни", "<p>Тот же город и та же длина поездки, вылет на 1–3 дня раньше или позже, дешевле минимум на 5 % и 300 ₽.</p>"]]], ["flight", "Выбрать рейс", [["times", "Время рейса и пересадки", "<ul><li>Время местное для каждого аэропорта. Прилёт рассчитан по длительности перелёта и отмечен знаком «≈».</li><li>Авиакомпания — из найденной цены. Кто выполняет каждый участок и какая авиакомпания везёт обратно, источник не сообщает.</li><li>Аэропорты пересадок и время ожидания источник тоже не сообщает — их видно на Aviasales.</li></ul>"], ["time-there", "Время на месте и цена часа", "<p>Время на месте — от расчётного прилёта до обратного вылета, включая ночи. Дорога из аэропорта и ожидание не вычитаются. Цена часа — цена билетов, делённая на эти часы.</p>"], ["flight-score", "Как оцениваем перелёт", "<p>Число от 0 до 100: на 65 % — цена билетов, на 35 % — дорога: длительность перелётов, пересадки, доля времени на месте и время вылетов. Жильё, безопасность и полный бюджет не учитываются.</p>"], ["flight-filters", "Ограничения по времени", "<p><b>Удобное время вылета.</b> Оба вылета с 06:00 до 22:59 по местному времени.</p><p><b>В пути до 3 ч.</b> Каждый перелёт известен и длится не больше трёх часов.</p><p><b>За эти же деньги.</b> До трёх других городов, где найденная цена отличается не больше чем на 15 %.</p>"]]], ["plan", "Спланировать поездку", [["city", "Цены на странице города", "<ul><li>Цена «от» и «Когда лететь дешевле» — самая низкая цена туда и обратно на одного, которую Aviasales недавно находил в каждом из ближайших шести месяцев, для поездок на 1–7 ночей. Месяц без найденных цен помечен «цен не нашли» — это не значит, что билетов нет.</li><li>Цены — из вашего города вылета. Без вашего выбора — из ближайшего крупного города по местоположению, которое определяет хостинг, иначе из Москвы. Готовая страница для поисковиков показывает цены из Москвы (на странице Москвы — из Петербурга).</li><li>Население — из Wikidata, с годом, к которому относится число.</li><li>Страницы есть у городов, куда находятся рейсы из больших городов России и для которых у нас есть фото со свободной лицензией. Авторы фото подписаны под снимком и на странице «Авторы фото».</li></ul>"], ["hotels", "Жильё и заметки о городах", "<ul><li>Кнопка «Отели» открывает поиск отелей Aviasales с городом и датами: заезд в день прилёта, выезд в день обратного вылета, один взрослый. Цены и условия — там.</li><li>На страницах городов есть ссылка на страницу города на Островке. Даты и число гостей выбираются там.</li><li>Заметки о городах пишет редакция; у каждой указана дата. Часы работы и транспорт проверяйте перед поездкой.</li></ul>"]]]];const $=id=>document.getElementById(id);let lastTopic,lockedFrame,anchorChoice;
function link(id,text,active,cls=''){return '<a class="'+cls+'" href="#'+id+'"'+(active?' aria-current="location"':'')+'>'+text+'</a>';}
function mark(){const nodes=[...document.querySelectorAll('article section')];const chosen=nodes.find(s=>s.id===anchorChoice);const current=chosen||(window.scrollY>0&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2?nodes.at(-1):nodes.filter(s=>s.getBoundingClientRect().top<=120).at(-1)||nodes[0]);for(const a of document.querySelectorAll('.outline a,.mobilelist a.sub')){if(a.hash==='#'+current.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');}}
function show(){const id=location.hash.slice(1)||'prices';const t=topics.find(([key,,ss])=>key===id||ss.some(([k])=>k===id))||topics[2];const [key,title,ss]=t;
if(lastTopic!==key){$('article').innerHTML='<div class="crumb">Как мы считаем</div><h1>'+title+'</h1>'+ss.map(([k,h,txt])=>'<section id="'+k+'"><h2>'+h+'</h2>'+txt+'</section>').join('');const next=topics[topics.indexOf(t)+1];if(next)$('article').insertAdjacentHTML('beforeend','<div class="jump">'+link(next[0],next[1]+' →')+'</div>');lastTopic=key;}
$('chapters').innerHTML=topics.map(([k,h])=>link(k,h,k===key)).join('');$('outline').innerHTML=ss.length>=3?'<p class="navtitle">В этом разделе</p>'+ss.map(([k,h])=>link(k,h,k===id)).join(''):'';
$('mobile').innerHTML=topics.map(([k,h,items])=>link(k,h,k===key)+(k===key?items.map(([i,n])=>link(i,n,i===id,'sub')).join(''):'')).join('');
anchorChoice=ss.some(([k])=>k===id)?id:null;if(id!==key&&document.getElementById(id))document.getElementById(id).scrollIntoView();else window.scrollTo(0,0);mark();}
$('contents').onclick=()=>$('menu').showModal();$('close').onclick=()=>$('menu').close();
$('mobile').onclick=e=>{const a=e.target.closest('a');if(a){$('menu').close();if(a.hash===location.hash)show();}};
for(const event of ['wheel','touchmove','keydown'])addEventListener(event,()=>{anchorChoice=null;},{passive:true});addEventListener('hashchange',show);addEventListener('scroll',()=>{cancelAnimationFrame(lockedFrame);lockedFrame=requestAnimationFrame(mark);},{passive:true});show();
</script></html>
