:root {--ink:#0f1b3d;--muted:#565d70;--accent:#2346d8;--line:#dbe0e8;--paper:#eef3f9;--mono:"Martian Mono",monospace;--head:Geologica,system-ui,sans-serif}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.48 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px} button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{border:0;background:none;padding:0}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--head)}.top{background:#fff;border-bottom:1px solid var(--line)}
nav,main{width:min(calc(100% - 64px),1120px);margin:auto}nav{display:flex;align-items:center;justify-content:space-between;height:66px}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 22px var(--head);text-decoration:none}
.brand span{display:grid;place-items:center;background:var(--accent);border-radius:8px;width:32px;height:32px;color:#fff}.brand svg{width:19px;height:19px}.how{font-size:14px;color:var(--ink);text-decoration:none}.how:hover{text-decoration:underline}
main{padding:38px 0 44px}.context{margin-bottom:5px;color:var(--muted);font-size:15px}h1{font-size:clamp(30px,4vw,43px);line-height:1.13;letter-spacing:-.045em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,438px);gap:clamp(28px,4vw,62px);margin-top:24px;align-items:start}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.search{position:relative;display:flex;align-items:center;flex:1;min-width:170px}.search svg{position:absolute;left:14px;width:17px;pointer-events:none;color:var(--muted)}
.search input{width:100%;border:1px solid #aab2c0;background:#fff;border-radius:9px;height:44px;padding:0 12px 0 41px}.only{font-size:13px;display:flex;align-items:center;gap:7px;min-height:44px;cursor:pointer}.only input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{overflow:hidden;background:white;border:1px solid var(--line);border-radius:13px}.tile.picked{border-color:#a1b3eb}
.tile img{width:100%;height:clamp(110px,10.5vw,146px);object-fit:cover;display:block}.tile-content{padding:13px 15px 15px}.city-meta{font-size:12px;color:var(--muted);margin-top:2px}.tile h2{font-size:clamp(17px,1.55vw,22px);line-height:1.2;letter-spacing:-.035em}.badge{display:inline-flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--accent);margin-top:11px;padding:0 9px;min-height:36px;border-radius:6px;background:#edf1ff;text-align:left}.badge:hover{background:#e1e8ff}.badge b{font:500 12px var(--mono);white-space:nowrap}
.empty p{margin:10px 0;color:var(--muted)}.empty button,.plain{color:var(--accent);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.panel:focus{outline:0}.panel{background:white;border:1px solid #d3dbe7;border-radius:16px;box-shadow:0 8px 26px -14px #20365555;overflow:hidden}
.topline{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 0 25px}.topline span,.back{font-size:14px;color:var(--muted);font-weight:600}.back{color:var(--accent);min-height:44px}.x{width:44px;height:44px;border-radius:50%;font:400 25px/1 system-ui;color:var(--muted)}.x:hover{background:var(--paper)}
.inside{padding:0 25px 1px}.cityhead{font-size:clamp(24px,2.3vw,31px);letter-spacing:-.045em;line-height:1.16}.month{font-size:14px;color:var(--muted);margin-top:4px}
.lead{display:flex;gap:22px;align-items:center;margin:19px 0 20px}.score{color:var(--accent);font:700 clamp(34px,3.3vw,46px)/1 var(--mono);letter-spacing:-.07em;white-space:nowrap}.score small{font-size:16px;letter-spacing:-.05em;font-weight:500;margin-left:3px}.lede{font-size:14px;line-height:1.4;max-width:202px}.incomplete{font:800 23px var(--head);letter-spacing:-.04em}.incomplete+.lede{max-width:228px}

e><thead><tr><th scope="col">Показатель</th><th class="num" scope="col">Балл /10</th><th class="num" scope="col">Вес</th></tr></thead><tbody><tr><th scope="row">Чем заняться<span class="fact">Музей современного искусства и Цистерна Базилика — в числе 10 мест.</span></th><td>10,0</td><td class="weight">35%</td></tr><tr><th scope="row">Расходы на месте<span class="fact">Нет сопоставимых цен на отель 3★ и обычный обед.</span></th><td>—</td><td class="weight">25%</td></tr><tr><th scope="row">Комфорт сезона<span class="fact">+10,7 °C днём, 124,8 мм осадков. Норма 1991–2020.</span></th><td>7,2</td><td class="weight">25%</td></tr><tr><th scope="row">Передвижение<span class="fact">До 14,6 мин пешком на проверенных маршрутах.</span></th><td>10,0</td><td class="weight">15%</td></tr></tbody></table></div><div class="foot"><button class="open-doc" type="button">Источники и расчёт</button><a href="https://aviatour.vercel.app/season/IST?month=12&amp;year=2026#city-rating">Подробнее о сезоне</a></div></template><template id="detailIST"><div class="topline"><button class="back" type="button">← К рейтингу</button><button class="x" type="button" aria-label="Закрыть рейтинг">×</button></div><div class="dochead"><h2 id="paneltitle">Источники и расчёт</h2><p class="month">Стамбул · декабрь 2026</p></div><div class="doc" tabindex="0" aria-label="Расчёт и список источников"><section><h3>Общая оценка</h3><p>Для общего балла нужны все четыре показателя. Доступные оценки можно посмотреть отдельно.</p></section><section><h3>Чем заняться · 35%</h3><p>Подтверждено занятий: 10. По одному баллу за место, до двух в каждой из пяти категорий. Проверка расписаний от 2026-11-18.</p><ul><li><a href="https://www.istanbulmodern.org/en/visit/museum">Стамбульский музей современного искусства</a> — Галереи открыты по субботам и воскресеньям.</li><li><a href="https://peramuseum.org/Home/Visit">Музей Пера</a> — В субботу музей открыт с 10 до 19 часов, в воскресенье — с 12 до 18 часов.</li><li><a href="https://www.millisaraylar.gov.tr/Lokasyon/2/Topkapi-Sarayi?culture=en">Дворец Топкапы</a> — Дворец принимает посетителей в субботу и воскресенье. Выходной день — вторник.</li><li><a href="https://yerebatansarnici.gov.tr/en/buy-ticket/">Цистерна Базилика</a> — Подземное византийское водохранилище открыто для посетителей ежедневно.</li><li><a href="https://okuldisiogrenme.eba.gov.tr/mekan-detay/ataturk-arboretumu-2712">Арборетум Ататюрка</a> — В субботу и воскресенье арборетум в Сарыере открыт с 9 до 17 часов.</li><li><a href="https://www.ngbb.org.tr/ziyaretci.html">Ботанический сад Незахат Гёкйигит</a> — У сада есть отдельные часы на ноябрь и декабрь. Он открыт в выходные, понедельник — день ухода за садом.</li><li><a href="https://www.karakoygulluoglu.com/sikca-sorulan-sorular">Баклава в кондитерской Karaköy Güllüoğlu</a> — В субботу и воскресенье в кондитерскую можно прийти с 8 утра до часа ночи.</li><li><a href="https://www.openstreetmap.org/node/14371377601">Кебаб в Şişli Kebap</a> — У ресторана турецкой кухни указан ежедневный режим с 10 утра до 2 часов ночи. Дата проверки часов в карточке — 13 ноября 2026 года.</li><li><a href="https://www.zorlupsm.com/etkinlikler">Выступление в центре сценических искусств Zorlu PSM</a> — 22 ноября проходит мюзикл «7 Kocalı Hürmüz», 5 декабря — концерт ASH с Евразийским филармоническим оркестром.</li><li><a href="https://www.nardisjazz.com/en/">Концерт в джаз-клубе Nardis</a> — 21 ноября выступает квинтет Сибель Кёсе, 28 ноября — İpek Dinç Band, 5 декабря — квинтет Эврим Озшуджи.</li></ul></section><section><h3>Расходы на месте · 25%</h3><p>Опубликованные цены и тарифы в местной валюте. Проверено 2026-11-18. Условия и даты приведены у каждого источника.</p><p>Нужны сопоставимые городские цены на проживание одного человека в гостинице 3★ и на обычный обед. Нужна полная корзина и сопоставимая группа минимум из 20 городов за тот же период.</p><ul><li><a href="https://iett.istanbul/icerik/IETT-Toplu-Ulasim-ucret-Tarifesi">İETT · решение № 813, тарифы на городской автобус</a> — С 20.07.2026 поездка на обычном городском автобусе İETT по İstanbulkart стоит 46,20 TRY для взрослого. Тариф подтверждён 18.11.2026.</li></ul></section><section><h3>Комфорт сезона · 25%</h3><p>Днём +10,7 °C · 124,8 мм осадков за месяц. Нормы 1991–2020. Температура даёт 80% оценки, осадки — 20%.</p><ul><li><a href="https://www.ncei.noaa.gov/products/wmo-climate-normals">Станция Sariyer · 16 км от координат города · ВМО</a></li></ul></section><section><h3>Передвижение · 15%</h3><p>Исторический центр · Сиркеджи и Кючюк-Айясофья. Из двух отелей до пяти мест за 30 минут можно добраться в 20 из 20 случаев. Модель на субботу в 10:00 и 15:00, при открытом проходе, без учёта погоды. Проверено 2026-11-18. Все десять путей укладываются в порог пешком. Расчётное время — 5,9–14,6 мин.</p><ul><li><a href="https://routing.openstreetmap.de/routed-foot/table/v1/foot/28.978661,41.0128862;28.973973,41.0031732;28.9807891,41.0081077;28.9759673,41.0059678;28.9814053,41.0085651;28.9779664,41.0084167;28.9699533,41.0100945?sources=0;1&amp;destinations=2;3;4;5;6&amp;annotations=duration,distance&amp;generate_hints=false">Расчёт маршрутов OSRM</a></li><li><a href="https://www.openstreetmap.org/copyright">© Участники OpenStreetMap</a></li><li><a href="https://www.openstreetmap.org/fixthemap">Исправить карту</a></li></ul></section></div></template>
<script>
const $=s=>document.querySelector(s), panel=$('#panel'), dialog=$('dialog'), slot=$('.slot'), narrow=matchMedia('(max-width:820px)'), tiles=[...document.querySelectorAll('.tile')];
const norm=s=>s.toLowerCase().replaceAll('ё','е').replace(/[^а-яa-z0-9]+/g,' ').trim();
let active=null, pinned=false, timer;
function show(code,details=false,focus=false){
 clearTimeout(timer);
 const wasMobile=dialog.open, tile=tiles.find(t=>t.dataset.code===code);
 if(!tile||tile.hidden)return;
 active=code;tiles.forEach(t=>{let on=t===tile;t.classList.toggle('picked',on);t.querySelector('button').setAttribute('aria-expanded',String(on))});
 panel.replaceChildren($('#'+(details?'detail':'summary')+code).content.cloneNode(true));panel.hidden=false;panel.scrollTop=0;
 if(narrow.matches){dialog.append(panel);if(!wasMobile)dialog.showModal()}else{slot.append(panel);if(dialog.open)dialog.close()}
 if(focus)panel.querySelector(details?'.back':'.x').focus({preventScroll:true});
}
function closePanel(refocus=false){
 clearTimeout(timer);let old=active;active=null;pinned=false;panel.hidden=true;if(dialog.open)dialog.close();
 tiles.forEach(t=>{t.classList.remove('picked');t.querySelector('button').setAttribute('aria-expanded','false')});
 const oldTile=tiles.find(t=>t.dataset.code===old);if(refocus&&oldTile&&!oldTile.hidden)oldTile.querySelector('button').focus({preventScroll:true});
}
function delayClose(){clearTimeout(timer);if(!pinned&&!narrow.matches)timer=setTimeout(()=>closePanel(),320)}
tiles.forEach(t=>{let btn=t.querySelector('button');btn.addEventListener('click',()=>{pinned=true;show(t.dataset.code,false,true)});
 btn.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!narrow.matches&&!pinned)show(t.dataset.code)});btn.addEventListener('pointerleave',delayClose)});
panel.addEventListener('pointerenter',()=>clearTimeout(timer));panel.addEventListener('pointerleave',delayClose);
panel.addEventListener('click',e=>{if(e.target.closest('.x'))closePanel(true);else if(e.target.closest('.open-doc')){pinned=true;show(active,true,true)}else if(e.target.closest('.back')){show(active);panel.querySelector('.open-doc').focus()}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closePanel(true)});
dialog.addEventListener('click',e=>{if(e.target===dialog)closePanel(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){e.preventDefault();closePanel(true)}});
document.addEventListener('pointerdown',e=>{if(active&&!narrow.matches&&!panel.contains(e.target)&&!e.target.closest('.badge'))closePanel()});
narrow.addEventListener('change',()=>{if(active)show(active,!!panel.querySelector('.back'))});
function filter(){
 let q=norm($('#query').value),full=$('#only').checked;
 tiles.forEach(t=>{let words=norm(t.dataset.terms);t.hidden=!!((q&&!words.includes(q))||(full&&t.dataset.full!=='yes'))});
 if(active&&tiles.find(t=>t.dataset.code===active)?.hidden)closePanel();
 const count=tiles.filter(t=>!t.hidden).length;$('.empty').hidden=count>0;$('#status').textContent='Найдено городов: '+count;
 $('#hint').textContent=full?'Попробуйте снять фильтр общей оценки или ввести другое название.':'Попробуйте название или код одного из городов примера.';
}
$('#query').addEventListener('input',filter);$('#only').addEventListener('change',filter);$('#reset').addEventListener('click',()=>{$('#query').value='';$('#only').checked=false;filter();$('#query').focus()});filter();show('LED');
</script></body></html>
