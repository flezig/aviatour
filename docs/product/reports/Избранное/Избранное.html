:root{--ink:#0f1b3d;--muted:#565d70;--blue:#2346d8;--bg:#eef3f9;--line:#d5dce7;--rose:#bd2857;--head:Geologica,system-ui,sans-serif;--body:"Golos Text",system-ui,sans-serif;--mono:"Martian Mono",monospace}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}a{color:var(--blue);text-underline-offset:3px}button,input{color:inherit;font:inherit}button{cursor:pointer;border:0;background:transparent}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}h1,h2,h3,p{margin:0}h1,h2,h3,.brand{font-family:var(--head)}[hidden]{display:none!important}

function identify(o,others){return others.some(p=>p.id!==o.id&&p.city===o.city)?o.city+' ('+o.shortDate+', '+o.outTime+')':o.city}
function difference(list){if(list.length!==2)return 'Выбрано '+list.length+' билета для сравнения.';let [a,b]=list;const x=a.price<=b.price?a:b,y=x===a?b:a;
 const lead=x.price===y.price?'Сохранённые цены совпадают.':(a.city===b.city?'Вылет '+x.shortDate+' в '+x.outTime:'Билет '+x.into)+' дешевле на '+money((y.price-x.price)/100)+'.';
 return lead+' '+stayDifference(list);
}
function stayDifference(list){
 const [a,b]=list;
 if(a.stay==null||b.stay==null)return 'Время на месте: нет данных для сравнения.';const longer=a.stay>=b.stay?a:b,delta=Math.abs(a.stay-b.stay);
 return (delta===0?'Времени на месте поровну.':(a.city===b.city?'У рейса '+longer.shortDate+' в '+longer.outTime:longer.fromLoc)+' можно провести на '+readable(delta)+' дольше.')}
function tile(o){const selected=saved.includes(o.id);return '<li><article class="ticket"><img class="pic" src="'+attr(o.img)+'" alt=""><div class="info"><button class="place" style="padding:0;text-align:left" data-open="'+o.id+'">'+html(o.city)+'</button><p class="when">'+html(o.dates)+' · вылет в '+html(o.outTime)+'</p><p class="sub">Из Москвы · '+html(o.from)+' → '+html(o.to)+'</p></div><div class="fare"><div class="price">'+money(o.price/100)+'</div><span class="price-note">туда и обратно</span></div><button class="heart" data-heart="'+o.id+'" aria-pressed="'+selected+'" aria-label="'+attr((selected?'Убрать из избранного':'Сохранить билет')+' — '+o.city+', '+o.shortDate+', '+o.outTime)+'">'+heart+'</button></article></li>'}
const listHTML=entries=>'<ul class="list">'+entries.map(tile).join('')+'</ul>';
function heading(title,desc,side=''){return '<div class="masthead"><div><h1 id="heading" tabindex="-1">'+title+'</h1>'+(desc?'<p class="deck">'+desc+'</p>':'')+'</div>'+side+'</div>'}
function undoHTML(){return undo?'<div class="undo"><span>Убрали билет — '+html(byId.get(undo.id).city)+', '+html(byId.get(undo.id).shortDate)+'</span><button type="button" class="link" id="undo">Вернуть</button></div>':''}
function favorites(){
 const chosen=selected().map(id=>byId.get(id));
 const diff=difference(chosen.length>=2?chosen:[]), stop=diff.indexOf('. ');
 const headline=chosen.length===2&&stop>0?diff.slice(0,stop):'Сравнение билетов';
 const note=chosen.length===2&&stop>0?diff.slice(stop+2):chosen.map(o=>identify(o,chosen)).join(' · ');
 const edit=saved.length>2?'<button class="link" data-edit>Выбрать билеты</button>':'';
 const bar=chosen.length>=2?'<section class="comparebar" aria-label="Быстрое сравнение"><div><h2>'+html(headline)+'</h2><p>'+html(note)+'</p></div><div class="subnav">'+edit+'<a class="action" href="#compare">Сравнить подробно</a></div></section>':'';
 const actions=saved.length?'<a class="link" href="#tickets">Найти ещё билеты →</a>':'';
 return heading('Избранное',saved.length?saved.length+' '+letters(saved.length):'',actions)+undoHTML()+(saved.length?'<div class="sheet">'+bar+listHTML(saved.map(id=>byId.get(id)))+'</div>':'<section class="sheet empty"><h2>Пока нет сохранённых билетов</h2><p>Нажмите сердечко рядом с билетом. Здесь можно вернуться к нему и сравнить с другим рейсом.</p><a class="action" href="#tickets">Найти билеты</a></section>');
}
function tickets(){const n=saved.length;return heading('Билеты','Примеры из выдачи Aviator за 18 ноября 2026','<a class="link" href="#fav">В избранное'+(n?' ('+n+')':'')+' →</a>')+undoHTML()+(n===2?'<div class="comparebar" style="margin-bottom:12px;border:1px solid var(--line);border-radius:8px"><span>Сохранены два билета</span><a class="link" href="#compare">Сравнить билеты →</a></div>':'')+'<div class="sheet">'+listHTML(offers)+'</div><p class="source"><a href="https://aviatour.vercel.app/">Открыть поиск на сайте Aviator</a></p>';}
function table(chosen){
 const min=Math.min(...chosen.map(o=>o.price)),max=Math.max(...chosen.map(o=>o.price));
 const priceNote=o=>{
  if(o.price!==min||min===max)return '';
  const note=chosen.length===2?'На '+money((max-min)/100)+' дешевле':'Минимальная цена';
  return '<small class="price-note-compare">'+html(note)+'</small>';
 };
 const fields=[['Цена',o=>money(o.price/100)],['Даты',o=>o.dates],['На месте',o=>readable(o.stay)],['Час на месте',o=>o.stay>0?money((o.price/100)/(o.stay/60)):'Нет данных'],['В пути за оба рейса',o=>readable(o.flight)],['Пересадки',o=>o.transfers],['Авиакомпания',o=>o.carrier||'Нет данных']];
 return (chosen.length>2?'<p class="widehint">Прокрутите таблицу вправо, чтобы увидеть остальные билеты.</p>':'')+'<div class="metrics" tabindex="0" role="region" aria-label="Сравнение выбранных рейсов"><table data-cols="'+chosen.length+'"><thead><tr><td></td>'+chosen.map(o=>'<th scope="col">'+html(o.city)+'<small>'+html(o.from+' → '+o.to)+'<br>'+html(o.shortDate+' · '+o.outTime)+'</small></th>').join('')+'</tr></thead><tbody>'+fields.map(([field,fn],i)=>'<tr><th scope="row">'+field+'</th>'+chosen.map(o=>'<td class="'+(i===0?'priced':'')+'">'+html(fn(o))+(i===0?priceNote(o):'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function comparison(){
 const chosen=selected().map(id=>byId.get(id)),edit=saved.length>2?'<button class="link" data-edit>Изменить выбор</button>':'';
 return '<a class="link back" href="#fav">← В избранное</a>'+heading('Сравнение билетов','Туда и обратно · один пассажир',edit)+'<div class="sheet">'+(chosen.length===2?'<p class="insight">'+html(chosen[0].price===chosen[1].price?difference(chosen):stayDifference(chosen))+'</p>':'')+table(chosen)+'<div class="sheetfoot">'+chosen.map(o=>'<button class="link" data-open="'+o.id+'">'+html(identify(o,chosen))+' →</button>').join('')+'</div></div>';
}
function render(){let v=location.hash.slice(1);if(!['compare','tickets'].includes(v))v='fav';if(v==='compare'&&saved.length<2){history.replaceState(null,'','#fav');v='fav'}mode=v;main.innerHTML=v==='tickets'?tickets():v==='compare'?comparison():favorites();
 for(const [id,on] of [['#favNav',v!=='tickets'],['#ticketsNav',v==='tickets']]){if(on)$(id).setAttribute('aria-current','page');else $(id).removeAttribute('aria-current')}
 document.title=(v==='tickets'?'Билеты':v==='compare'?'Сравнение билетов':'Избранное')+' · Aviator';}
function toggle(id){if(saved.includes(id)){undo={id,index:saved.indexOf(id),choice:[...choice]};saved=saved.filter(x=>x!==id);choice=choice.filter(x=>x!==id);announce('Билет убран. Можно вернуть.')}else{undo=null;saved=[id,...saved].slice(0,30);announce(saved.length===2?'Сохранён второй билет. Можно сравнить поездки.':'Билет сохранён.')}
 save();render();(mode==='tickets'?main.querySelector('[data-heart="'+id+'"]'):$('#undo')||main.querySelector('[data-heart]'))?.focus({preventScroll:true});}
function restore(){if(!undo)return;let {id,index,choice:prev}=undo;saved=saved.filter(x=>x!==id);saved.splice(Math.min(index,saved.length),0,id);choice=prev.filter(x=>saved.includes(x));undo=null;save();render();main.querySelector('[data-heart="'+id+'"]')?.focus({preventScroll:true});announce('Билет вернули на прежнее место.');}
function openDialog(title,content,opener){dialogOpener=opener;$('#dialogbody').innerHTML='<div class="dialoghead"><h2 id="dialogTitle">'+html(title)+'</h2><button class="close" data-close aria-label="Закрыть">×</button></div>'+content;dialog.showModal();}
function close(){if(dialog.open)dialog.close()}
function details(id,opener){const o=byId.get(id);
 let lines=[['Даты',o.dates],['Туда',o.outLabel],['Обратно',o.backLabel],['Аэропорты',o.from+' → '+o.to],['Время на месте',readable(o.stay)],['Пересадки',o.transfers],['Сохранённая цена',money(o.price/100)]];
 const handoff=Date.parse(o.outISO)>Date.now()?'<a class="action" href="'+attr(o.seller)+'" target="_blank" rel="noopener sponsored">Проверить на Aviasales ↗</a>':'<span>Дата вылета прошла.</span>';
 openDialog(o.city,'<p class="sub">Из Москвы · билет туда и обратно</p><img class="routepic" alt="" src="'+attr(o.img)+'"><dl>'+lines.map(([k,v])=>'<div class="detail-line"><dt>'+html(k)+'</dt><dd>'+html(v)+'</dd></div>').join('')+'</dl><p class="source">Цена из выдачи от '+html(o.stamp)+'. Время вылета местное.</p><div class="dialogactions">'+handoff+'<a href="'+attr(o.season)+'">Рейтинг города</a>'+(o.guide?'<a href="'+attr(o.guide)+'">О городе</a>':'')+'</div>',opener);}
function picker(opener){draft=[...selected()];openDialog('Какие билеты сравнить?', '<p class="sub" style="margin:2px 0 12px">Выберите от двух до четырёх.</p>'+saved.map(id=>{let o=byId.get(id);return '<label class="choose"><input type="checkbox" value="'+id+'" '+(draft.includes(id)?'checked':'')+'><span><b>'+html(o.city)+' · '+money(o.price/100)+'</b><small>'+html(o.dates+' · '+o.outTime+' · '+o.from+' → '+o.to)+'</small></span></label>'}).join('')+'<div class="choosebar"><span id="selectionCount" role="status"></span><button class="action" id="apply">Сравнить</button></div>',opener);updatePicker()}
function updatePicker(){$('#selectionCount').textContent='Выбрано '+draft.length+' из 4';$('#apply').disabled=draft.length<2||draft.length>4;dialog.querySelectorAll('input').forEach(i=>i.disabled=!i.checked&&draft.length===4)}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.heart)toggle(b.dataset.heart);else if(b.dataset.open)details(b.dataset.open,b);else if(b.hasAttribute('data-edit'))picker(b);else if(b.id==='undo')restore()});
dialog.addEventListener('change',e=>{if(e.target.matches('.choose input')){const {value,checked}=e.target;draft=checked?[...draft,value]:draft.filter(x=>x!==value);updatePicker()}});
dialog.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dialog)close();if(e.target.closest('#apply')&&draft.length>=2&&draft.length<=4){choice=[...draft];save();close();if(mode!=='compare'){location.hash='compare'}else{render();main.querySelector('[data-edit]')?.focus({preventScroll:true})}announce('Сравнение обновлено.')}});
dialog.addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus({preventScroll:true});dialogOpener=null});
window.addEventListener('hashchange',()=>{if(dialog.open)close();render();window.scrollTo(0,0);$('#heading').focus({preventScroll:true})});render();save();
</script></body></html>
